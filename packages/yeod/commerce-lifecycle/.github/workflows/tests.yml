name: tests
on: [ push, pull_request ]
jobs:
  test:
    strategy:
      matrix:
        php: [ '8.3', '8.4' ]
        laravel: [ '^12.0', '^13.0' ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "${{ matrix.php }}", extensions: pdo_sqlite }
      - run: composer require --dev "illuminate/contracts:${{ matrix.laravel }}" --no-interaction --no-progress
      - run: composer install --no-interaction --no-progress
      - run: composer test
      - run: composer analyse
